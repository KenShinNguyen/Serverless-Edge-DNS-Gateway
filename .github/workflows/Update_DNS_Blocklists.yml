name: Update DNS Blocklists

on:
  schedule:
    # Mỗi 3 giờ — đủ tươi cho list quảng cáo, tránh phình lịch sử git
    # (mỗi commit là ~25MB blocklist)
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Chặn 2 lần chạy chồng nhau (ví dụ: workflow_dispatch thủ công trong lúc lịch
# cron cũng đang chạy) — đây là nguyên nhân phổ biến nhất khiến bước "Commit
# and Push changes" bị remote từ chối (non-fast-forward): 2 job cùng checkout
# ở base commit giống nhau, job push sau bị đá vì main đã bị job kia đẩy lên
# trước. cancel-in-progress: true huỷ job cũ, chỉ giữ lại lần chạy mới nhất —
# an toàn vì mọi thứ chỉ tồn tại trên runner tạm, chưa từng commit dở dang.
#
# Group đặt cố định theo tên file thay vì ${{ github.workflow }}: biến đó trả
# về tên hiển thị của workflow, nên 2 file lỡ trùng `name:` sẽ dùng chung một
# group và huỷ lẫn nhau mỗi lần cron chạy.
concurrency:
  group: update-dns-blocklists-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-lists:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Giai đoạn 8: cache kết quả tải các nguồn chưa đổi giữa các lần chạy.
      # Key chứa run_id nên luôn là key mới (bắt buộc để actions/cache lưu lại
      # cache mới sau mỗi job) — restore-keys lấy cache gần nhất làm nền, nhờ
      # đó scripts/download.sh (curl -z) có thể bỏ qua tải lại nguồn không đổi.
      - name: Restore blocklist download cache
        uses: actions/cache@v4
        with:
          path: .cache/blocklists
          key: blocklist-cache-${{ github.run_id }}
          restore-keys: |
            blocklist-cache-

      - name: Run update script
        run: |
          set -euo pipefail
          # enable nullglob so the for-loop below simply skips when no files match
          shopt -s nullglob || true

          # Make update_lists.sh executable if present; don't fail if it's missing
          if [ -f ./update_lists.sh ]; then
            [ -x ./update_lists.sh ] || chmod +x ./update_lists.sh || true
          else
            echo "update_lists.sh not found — the step will still run (may fail later if required)."
          fi

          # Safely make any scripts in scripts/ executable (no-op if none exist)
          for f in scripts/*.sh; do
            [ -x "$f" ] || chmod +x "$f" || true
          done

          ./update_lists.sh

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update: blocklists and allowlists"
          file_pattern: 'rules/*.txt'
          branch: ${{ github.ref }}

      # Giai đoạn 7: health-check sau khi push — Cloudflare Pages tự động
      # build+deploy khi thấy push mới trên nhánh này (không có bước deploy
      # thủ công trong workflow). scripts/healthcheck.sh tự retry vài lần nếu
      # deploy chưa kịp xong.
      - name: Health check DoH endpoint
        if: success()
        run: |
          set -euo pipefail
          if [ -f scripts/healthcheck.sh ]; then
            [ -x scripts/healthcheck.sh ] || chmod +x scripts/healthcheck.sh || true
            scripts/healthcheck.sh
          else
            echo "scripts/healthcheck.sh not found — skipping health check"
          fi
        env:
          HEALTHCHECK_ENDPOINT: ${{ vars.HEALTHCHECK_ENDPOINT || 'https://sedg.pages.dev' }}
          DOH_TOKEN: ${{ secrets.DOH_TOKEN }}
