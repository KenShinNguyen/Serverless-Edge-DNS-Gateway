name: Update DNS Blocklists

on:
  schedule:
    # Mỗi 3 giờ — đủ tươi cho list quảng cáo, tránh phình lịch sử git
    # (mỗi commit là ~25MB blocklist)
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lists:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run update script
        run: |
          chmod +x update_lists.sh
          ./update_lists.sh

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update: blocklists and allowlists"
          file_pattern: 'rules/*.txt'
          branch: ${{ github.ref }}
