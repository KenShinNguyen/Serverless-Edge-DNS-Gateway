name: Update DNS Blocklists

on:
  schedule:
    # Download fresh inputs every three hours, but propose changes for review.
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Do not cancel an in-flight download: one complete candidate PR is safer than
# a partial run. The PR action reuses a single automation branch on later runs.
concurrency:
  group: update-dns-blocklists-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-lists:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 24 for drop guards
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # A GITHUB_TOKEN-created PR does not trigger CI until a human marks
      # it ready for review. Do not mutate that PR's HEAD while it is being
      # reviewed; the next refresh runs after the existing PR is closed/merged.
      - name: Check for an existing rule review PR
        id: review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OPEN_PR="$(gh pr list --state open --head automation/dns-blocklists --json number --jq '.[0].number // empty')"
          if [ -n "$OPEN_PR" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Rule review PR #$OPEN_PR is still open; skipping this refresh."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run guarded update script
        if: steps.review.outputs.exists != 'true'
        run: ./update_lists.sh

      # Updates never push directly to main. The generated candidate waits for
      # human review before it can become input to the R2 publisher.
      - name: Open or update the blocklist review PR
        if: steps.review.outputs.exists != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/dns-blocklists
          delete-branch: true
          draft: true
          commit-message: "chore(rules): refresh DNS blocklists"
          title: "chore(rules): refresh DNS blocklists"
          body: |
            Scheduled blocklist refresh candidate.

            - Generated by update_lists.sh
            - Protected by source-failure, minimum-count, and previous-list drop guards
            - Requires human review and merge
            - Does not publish to Production R2 or deploy the Worker
          add-paths: |
            rules/blocklists.txt
            rules/allowlists.txt
