name: Update DNS Blocklists

on:
  schedule:
    # Mỗi 3 giờ — đủ tươi cho list quảng cáo, tránh phình lịch sử git
    # (mỗi commit là ~25MB blocklist)
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Chặn 2 lần chạy chồng nhau (ví dụ: workflow_dispatch thủ công trong lúc lịch
# cron cũng đang chạy) — đây là nguyên nhân phổ biến nhất khiến bước "Commit
# and Push changes" bị remote từ chối (non-fast-forward): 2 job cùng checkout
# ở base commit giống nhau, job push sau bị đá vì main đã bị job kia đẩy lên
# trước. cancel-in-progress: true huỷ job cũ, chỉ giữ lại lần chạy mới nhất —
# an toàn vì mọi thứ chỉ tồn tại trên runner tạm, chưa từng commit dở dang.
#
# Group đặt cố định theo tên file thay vì ${{ github.workflow }}: biến đó trả
# về tên hiển thị của workflow, nên 2 file lỡ trùng `name:` sẽ dùng chung một
# group và huỷ lẫn nhau mỗi lần cron chạy.
concurrency:
  group: update-dns-blocklists-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-lists:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Đã bỏ bước "Restore blocklist download cache" (actions/cache): nó lưu
      # thư mục .cache/blocklists mà update_lists.sh không hề ghi vào, còn key
      # lại gắn ${{ github.run_id }} nên không lần nào trùng. Kết quả là mỗi
      # run đều "Cache not found" rồi kết thúc bằng cảnh báo "Path Validation
      # Error: Path(s) ... do(es) not exist" — không tiết kiệm được gì. Muốn
      # cache thật thì phải cho update_lists.sh tải bằng curl -z vào đúng thư
      # mục đó trước đã.

      - name: Run update script
        run: ./update_lists.sh

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update: blocklists and allowlists"
          file_pattern: 'rules/*.txt'
          branch: ${{ github.ref }}

      # Health check sau khi push — Cloudflare Pages tự build+deploy khi thấy
      # commit mới trên nhánh này, nên script tự retry vài lần chờ deploy xong.
      # Nó kiểm tra cả phân giải bình thường lẫn việc blocklist có thực sự được
      # nạp (doubleclick.net phải trả NXDOMAIN).
      #
      # HEALTHCHECK_ENDPOINT KHÔNG có giá trị mặc định: trước đây mặc định là
      # sedg.pages.dev — không phải deployment của repo này, nên ai fork về
      # cũng đi kiểm tra tên miền của người khác. Thiếu biến thì script bỏ qua
      # êm và in hướng dẫn đặt biến.
      - name: Health check DoH endpoint
        if: success()
        run: scripts/healthcheck.sh
        env:
          HEALTHCHECK_ENDPOINT: ${{ vars.HEALTHCHECK_ENDPOINT }}
          DOH_TOKEN: ${{ secrets.DOH_TOKEN }}
