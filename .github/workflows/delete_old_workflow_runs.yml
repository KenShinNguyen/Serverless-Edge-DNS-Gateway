name: Delete Old Workflow Runs
on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * *'

# Cấp quyền cho GITHUB_TOKEN để xóa workflow runs
permissions:
  actions: write

jobs:
  del_runs:
    runs-on: ubuntu-latest
    steps:
      - name: Delete Workflow Runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          # Giữ đủ lịch sử để còn truy được nguyên nhân khi một lần chạy hỏng:
          # retain_days: 1 + keep_minimum_runs: 0 xoá gần như sạch log mỗi đêm,
          # nên lỗi xảy ra hôm trước là mất dấu vết.
          retain_days: 10
          keep_minimum_runs: 10
