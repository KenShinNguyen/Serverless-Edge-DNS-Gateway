# ============================================================================
# Lớp 2 (Cloudflare Gateway) — đẩy list bảo mật HaGeZi TIF vào Zero Trust.
#
#   Thiết bị ──DoH──▶ Serverless-Edge-DNS-Gateway (Lớp 1: quảng cáo/tracking)
#                            │
#                            ▼
#                  Cloudflare Gateway (Lớp 2: workflow này — malware/phishing)
#
# ⚠️ WORKFLOW NÀY CHỈ CHẠY THỦ CÔNG (workflow_dispatch). ĐỌC KỸ TRƯỚC KHI BẬT
# LẠI LỊCH TỰ ĐỘNG.
#
# Lý do: nó chạy CGPS, mà CGPS đặt tên list cố định là "CGPS List - Chunk N"
# và dùng chung một rule tên "CGPS Filter Lists". Nếu bạn còn một chỗ khác
# cũng chạy CGPS trên CÙNG tài khoản Cloudflare (ví dụ repo
# cloudflare-gateway-pihole-scripts riêng để chặn quảng cáo), hai bên sẽ ghi
# đè lẫn nhau: bên chạy sau chiếm các chunk đầu, bên chạy trước mất phần đó.
# CGPS không có cơ chế namespace để tách hai bộ list.
#
# Ngoài ra quota gói Free chỉ có 300.000 item: một bộ list quảng cáo cỡ
# ~298k domain cộng TIF ~170k là 468k — vượt trần, không thể cùng tồn tại.
#
# Nếu bạn đã dùng Gateway để chặn quảng cáo, ĐỪNG bật workflow này. Hãy lấy
# malware/phishing từ Security Categories có sẵn của Zero Trust: miễn phí,
# do Cloudflare tự cập nhật và KHÔNG tính vào quota 300k. Xem README, mục
# "Lớp 2".
#
# Workflow này chỉ hợp lý khi Gateway của bạn dành riêng cho bảo mật (lớp 1
# đã lo toàn bộ quảng cáo tại edge với ~1M domain).
#
# Secrets bắt buộc: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# (phải là tài khoản sở hữu endpoint Gateway khai trong UPSTREAM_PRIMARY).
# Secrets tùy chọn: CLOUDFLARE_LIST_ITEM_LIMIT, DISCORD_WEBHOOK_URL, PING_URL
# Có thể override nguồn bằng Actions Variables: BLOCKLIST_URLS/ALLOWLIST_URLS.
# ============================================================================
name: Update Filter Lists

# CỐ Ý không có `schedule` và `push`: xem cảnh báo ở đầu file. Chỉ bật lại khi
# chắc chắn không có nơi nào khác chạy CGPS trên cùng tài khoản Cloudflare.
on:
  workflow_dispatch:

# Group cố định theo tên file, KHÔNG dùng ${{ github.workflow }}: biến đó trả
# về tên hiển thị của workflow, nên nếu 2 file lỡ trùng `name:` chúng sẽ rơi
# chung một group và huỷ lẫn nhau (cancel-in-progress) mỗi lần cron chạy.
concurrency:
  group: update-gateway-security-lists-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: production
  # Lớp 2 chỉ lo bảo mật: phishing / scam / ransomware.
  #
  # Nguồn thuộc blocklistproject/Lists. Số liệu đo ngày 2026-08-23, cả ba URL
  # đều trả HTTP 200:
  #
  #   phishing.txt    190.205 domain
  #   scam.txt          8.527 domain
  #   ransomware.txt    1.904 domain
  #   ────────────────────────────────
  #   gộp + khử trùng lặp: ~200.600 domain
  #
  # Nằm gọn trong quota 300.000 item của gói Zero Trust Free. CỐ Ý KHÔNG thêm
  # blocklistproject malware.txt: riêng nó đã 2,66 triệu dòng, vượt xa quota nên
  # CGPS sẽ cắt bớt ngẫu nhiên. Đã dò 23 domain quan trọng (Google, GitHub,
  # Microsoft, Apple, PayPal, các ngân hàng VN, Shopee, Zalo…) — không cái nào
  # bị chặn nhầm.
  #
  # Định dạng hosts (0.0.0.0 <domain>) — CGPS đọc được trực tiếp. Bước
  # "Verify downloaded lists" bên dưới BẮT BUỘC phải đếm được định dạng này;
  # xem chú thích ở đó trước khi sửa regex.
  #
  # Ghi chú lịch sử: chú thích cũ ở đây nói repo hagezi/dns-blocklists đã biến
  # mất khỏi GitHub. Điều đó KHÔNG còn đúng — kiểm tra lại ngày 2026-08-23,
  # raw.githubusercontent.com/hagezi/dns-blocklists trả HTTP 200. Nếu muốn quay
  # về HaGeZi thì dùng wildcard/tif-onlydomains.txt, nhưng lưu ý list đó hiện có
  # 2.122.191 domain — gấp 7 lần quota, KHÔNG dùng trực tiếp được.
  DEFAULT_BLOCKLIST_URLS: |
    https://raw.githubusercontent.com/blocklistproject/Lists/master/phishing.txt
    https://raw.githubusercontent.com/blocklistproject/Lists/master/scam.txt
    https://raw.githubusercontent.com/blocklistproject/Lists/master/ransomware.txt
  # Dòng đầu: allowlist dùng chung với Lớp 1 (rules/allowlists.txt của repo này)
  # — đây chính là cơ chế đồng bộ allowlist giữa 2 lớp mà rules/allowlists.txt
  # mô tả. Dòng sau: chống chặn nhầm phổ biến của list bảo mật (~3.999 domain
  # ngân hàng). Bước "Download allowlists" tham chiếu biến này, nên KHÔNG xoá nó
  # mà không sửa luôn bước đó.
  DEFAULT_ALLOWLIST_URLS: |
    https://raw.githubusercontent.com/KenShinNguyen/Serverless-Edge-DNS-Gateway/main/rules/allowlists.txt
    https://raw.githubusercontent.com/AdguardTeam/HttpsExclusions/master/exclusions/banks.txt

jobs:
  # Lớp 2 là tuỳ chọn: repo mới fork về chưa có secrets Cloudflare. Kiểm tra
  # trước để workflow bỏ qua êm thay vì fail đỏ ở bước `cloudflare-create`.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Bỏ qua Lớp 2 (CGPS): chưa có secret CLOUDFLARE_API_TOKEN và/hoặc CLOUDFLARE_ACCOUNT_ID."
          fi

  cgps:
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: "mrrfv/cloudflare-gateway-pihole-scripts"
          ref: "v1"

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"

      - name: Install npm dependencies
        run: npm ci

      - name: Download allowlists
        run: npm run download:allowlist
        env:
          ALLOWLIST_URLS: ${{ vars.ALLOWLIST_URLS || env.DEFAULT_ALLOWLIST_URLS }}

      - name: Download blocklists
        run: npm run download:blocklist
        env:
          BLOCKLIST_URLS: ${{ vars.BLOCKLIST_URLS || env.DEFAULT_BLOCKLIST_URLS }}

      # Chốt an toàn bắt buộc: downloadFiles của CGPS gọi fetch() rồi ghi thẳng
      # response.body ra file mà KHÔNG kiểm tra response.ok. Nguồn 404/403 vì
      # thế chỉ tạo ra file rỗng (hoặc chứa trang lỗi) và script vẫn in "Done",
      # nên workflow xanh trong khi Cloudflare Gateway không nhận domain nào —
      # đúng tình trạng đã xảy ra với URL domains/tif.mini.txt trước đây.
      #
      # Kiểm tra TỪNG nguồn một, không chỉ tổng: gộp rồi mới đếm thì một nguồn
      # nhỏ chết đi gần như không làm tổng suy chuyển, và thông báo lỗi cũng
      # không chỉ ra được URL nào hỏng.
      - name: Verify downloaded lists
        env:
          BLOCKLIST_URLS: ${{ vars.BLOCKLIST_URLS || env.DEFAULT_BLOCKLIST_URLS }}
          MIN_BLOCK_DOMAINS: ${{ vars.MIN_BLOCK_DOMAINS || '50000' }}
          MIN_PER_SOURCE: ${{ vars.MIN_PER_SOURCE || '500' }}
        run: |
          # GitHub chạy block này bằng `bash -e`, nghĩa là script dừng ngay ở
          # lệnh đầu tiên trả non-zero. Ở đây ta MUỐN kiểm tra hết mọi nguồn rồi
          # mới báo lỗi một thể, nên tắt -e và tự gom kết quả vào $fail.
          set +e
          set -uo pipefail

          # Đếm được CẢ HAI định dạng mà CGPS ghi thẳng ra file:
          #
          #   bare   : example.com
          #   hosts  : 0.0.0.0 example.com   /   127.0.0.1 example.com
          #
          # Regex cũ chỉ khớp bare, nên mọi nguồn định dạng hosts (toàn bộ
          # blocklistproject/Lists) đều bị đếm thành 0 và workflow báo nhầm là
          # "URL nguồn đã hỏng (404/403)" trong khi nguồn vẫn trả HTTP 200.
          #
          # Nhãn cuối phải bắt đầu bằng chữ cái: nếu không thì dòng chỉ thị
          # trống trong file hosts ("0.0.0.0") lại bị tính là một domain.
          DOMAIN_RE='^((0\.0\.0\.0|127\.0\.0\.1)[[:space:]]+)?([a-z0-9]([a-z0-9_-]{0,61}[a-z0-9])?\.)+[a-z][a-z0-9-]{0,61}[[:space:]]*$'

          count_domains() {
            [ -f "$1" ] || { echo 0; return; }
            grep -ciE "$DOMAIN_RE" "$1" || true
          }

          fail=0

          # 1) Từng nguồn blocklist: phải trả HTTP 2xx và đóng góp đủ domain.
          while IFS= read -r url; do
            url=$(printf '%s' "$url" | tr -d '[:space:]')
            if [ -z "$url" ]; then continue; fi
            code=$(curl -sS -o src.tmp -w '%{http_code}' \
                     --connect-timeout 30 --max-time 300 --compressed -L "$url" || echo 000)
            n=$(count_domains src.tmp)
            if [ "$code" != "200" ]; then
              echo "::error::Nguồn trả HTTP $code — $url"
              fail=1
            elif [ "$n" -lt "$MIN_PER_SOURCE" ]; then
              echo "::error::Nguồn chỉ có $n domain (< $MIN_PER_SOURCE) — $url"
              fail=1
            else
              echo "✅ $n domain — $url"
            fi
            rm -f src.tmp
          done <<< "$BLOCKLIST_URLS"

          # 2) Tổng sau khi CGPS gộp: chốt chặn cuối, bắt cả lỗi ở khâu gộp.
          block=$(count_domains blocklist.txt)
          allow=$(count_domains allowlist.txt)
          echo "─────────────────────────────────────────"
          echo "blocklist.txt: $block domain | allowlist.txt: $allow domain"

          if [ "$block" -lt "$MIN_BLOCK_DOMAINS" ]; then
            echo "::error::Blocklist gộp chỉ có $block domain (< $MIN_BLOCK_DOMAINS). Nếu từng nguồn ở trên đều ✅ thì lỗi nằm ở khâu gộp của CGPS, không phải ở URL nguồn."
            fail=1
          fi
          if [ "$allow" -eq 0 ]; then
            echo "::warning::Allowlist rỗng — nguồn allowlist có thể đã hỏng. Vẫn tiếp tục vì allowlist chỉ ảnh hưởng phần ngoại lệ."
          fi

          exit $fail

      - name: Create or update rules and lists
        run: npm run cloudflare-create
        env:
          # Giữ block response mặc định (0.0.0.0). KHÔNG cấu hình Gateway trả
          # về 127.0.0.1: logic Geo-Bypass của Lớp 1 sẽ coi đó là geo-block
          # và re-resolve qua Mullvad, vô tình mở chặn domain.
          BLOCK_PAGE_ENABLED: ${{ vars.BLOCK_PAGE_ENABLED }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_LIST_ITEM_LIMIT: ${{ secrets.CLOUDFLARE_LIST_ITEM_LIMIT }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Send ping request
        if: env.PING_URL != ''
        run: |
          curl "${{ env.PING_URL }}"
        env:
          PING_URL: ${{ secrets.PING_URL }}

  # Job keepalive đã bỏ: nó chỉ có tác dụng với workflow chạy theo `schedule`
  # (GitHub tự tắt lịch của repo im ắng 60 ngày), mà workflow này nay chỉ chạy
  # thủ công.
